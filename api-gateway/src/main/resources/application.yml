server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
            - id: vehicle-service
              uri: lb://VEHICLE-SERVICE
              predicates:
                - Path=/api/v1/vehicles/**
            - id: parking-service
              uri: lb://PARKING-SPACE-SERVICE
              predicates:
                - Path=/api/v1/parking/**
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/